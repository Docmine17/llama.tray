[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-tray"
version = "0.1.0"
description = "A system tray manager for llama.cpp on Linux (GTK 3)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyGObject>=3.40.0",
    "pycairo>=1.20.0",
]

[project.scripts]
llama-tray = "src.main:main"
